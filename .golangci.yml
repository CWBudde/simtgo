# golangci-lint configuration.
#
# The set below is the tool's default plus fourteen linters, every one of them
# measured clean on this tree before it was turned on; nothing here is
# aspirational. A linter that would need its findings silenced across the
# repository is left off rather than enabled and muzzled, because a config that
# reports zero issues only because it was told to is worse than no config at
# all. Exactly two findings are scoped out, each next to the rule it belongs to
# and each with the argument in full -- if a third ever wants to join them, the
# bar is that same paragraph, not a path.
#
# Not covered: the `cuda`-tagged half of the tree. A single run sees one build
# configuration, and the untagged one is where the transpiler, the analyzer and
# the CPU emulator live -- the bulk of the code and all of the logic a lint can
# reason about. The driver and NVRTC bindings behind //go:build cuda are
# reached by `go vet -tags cuda ./...` in CI instead, which is weaker but real.
# `just lint-cuda` is the full run for that half, and it is not automated:
# three of the fourteen's findings were only ever visible there, and two
# errcheck findings are open there now.
version: "2"

linters:
  default: standard
  enable:
    # Prose is a first-class concern in this repository; a typo in a doc
    # comment survives review much longer than one in an identifier.
    - misspell
    # Doc comments here are full sentences by convention, and godot is the
    # only thing that keeps that from drifting one comment at a time.
    - godot
    # The emitter's whole job is types; a conversion that does nothing is a
    # sign the author was unsure which type they had.
    - unconvert
    - copyloopvar
    - usestdlibvars
    - nilerr
    - nakedret
    # Every error this repository hands back is meant to be matched rather than
    # read: `cuda.Result`'s sentinels exist so that `errors.Is` works in a
    # `!cuda` build too. A bare type assertion is the one shape that keeps
    # working until somebody wraps the error once, and then stops.
    - errorlint
    # The fuzz harness builds Go source one literal at a time, so formatting a
    # number is not an incidental cost there; and fmt.Errorf with no verb is
    # errors.New wearing a disguise, which is worth catching for its own sake.
    - perfsprint
    # A local named `any`, `min` or `real` compiles and reads at its use site
    # exactly as the builtin would. In a repository whose subject is which type
    # a value has, a variable that looks like `any` is worse than merely
    # confusing.
    - predeclared
    # Worth it for one check alone: offBy1 found a test that sliced at
    # strings.Index's result without testing it for -1, two lines above a guard
    # the author had already written for exactly that case.
    - gocritic
    # `for i := range n` is the spelling this module's Go has, and the five
    # loops it found were the only ones left writing the old one. One of them
    # re-evaluated its own bound on every iteration, which is what a C-style
    # loop lets you not notice.
    - intrange
    # A value written and then overwritten before anything reads it is either
    # a leftover or a missing branch, and the two are indistinguishable from
    # the outside -- which is the reason to have neither.
    - wastedassign
    # The godot/misspell argument extended to the comments that are not there:
    # revive's `exported` rule is what keeps a new exported name from shipping
    # undocumented. Its `unused-parameter` and `redefines-builtin-id` rules
    # come with it and both earned their place above.
    - revive

  settings:
    errcheck:
      # Writing usage text to a flag set's output or to stderr has no failure
      # a program can act on -- the place the message would go is the thing
      # that failed. Checking it would only add noise at every call site.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    generated: lax
    paths:
      # Written by `gocuda generate`; its shape is the generator's business.
      - kernels/prebuilt/prebuilt_gen\.go
    rules:
      # gocritic's ifElseChain is a style rule, and kernel sources are the one
      # place where style is not free: `kernels/` is input to the emitter, so
      # rewriting an if/else chain as a tagless switch -- which SPEC.md says
      # lowers back to an if/else chain anyway -- would change the generated
      # CUDA C, every SourceHash with it, and so every file under
      # simt/testdata/ and kernels/prebuilt/. Regenerating the whole artifact
      # set to satisfy a cosmetic rule is the wrong trade; the rule is scoped
      # out here rather than the finding being silenced in the file.
      - path: ^kernels/
        linters:
          - gocritic
        text: ifElseChain
      # Every parameter in stub.go is unused by construction: the file is the
      # API a machine with no CUDA sees, and each function returns ErrNoCUDA
      # without looking at anything. The names are not decoration, they are the
      # whole of that build's godoc -- `Alloc(n int)` documents itself, and
      # `Alloc(_ int)` documents nothing. surface_test.go compares exported
      # *names* against the tagged driver and would pass either way, which is
      # exactly why the choice has to be made here and argued.
      - path: ^cuda/stub\.go$
        linters:
          - revive
        text: unused-parameter
      # A deferred Close on a CUDA context in an example or a test has nowhere
      # to report to: the process is on its way out and the device teardown is
      # not what the example or the test is demonstrating.
      - path: (^examples/|_test\.go$)
        linters:
          - errcheck
        source: \.Close\(\)

formatters:
  enable:
    - gofmt
