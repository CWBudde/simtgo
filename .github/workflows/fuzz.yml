# The differential fuzzer, run for long enough to find something.
#
# This is deliberately NOT part of ci.yml. The seed corpus already runs there,
# as ordinary tests under plain `go test`, and that is the regression suite:
# it is what keeps a case the fuzzer once found from coming back, and it costs
# a couple of seconds on every push. Searching for *new* cases is a different
# job with a different budget, and putting it in CI would mean either a CI run
# that takes half an hour or a search too short to reach anything.
#
# Two schedules, because they answer different questions. The daily run is the
# regression cadence: every defect the fuzzer has found so far turned up in
# minutes, so twenty of them is generous for "did the last day's commits break
# something". Whether a *deeper* case exists is a question twenty minutes
# cannot answer at all, and that is the weekly leg's job -- four hours, once,
# rather than a daily bill nobody reads.
#
# The NVRTC oracle runs here too, in a job of its own. It needs a CUDA toolkit
# and not a device -- NVRTC compiles to PTX and nothing is launched -- so the
# nvrtc-cu12 wheel is enough, and SIMTGO_LIBNVRTC points the loader's search at
# it. That is the same trick docs/toolchain.md records for running
# TestGeneratedCCompiles on a machine with no GPU.
#
# A case this finds is a file under simt/testdata/fuzz/, which is committed by
# hand after it has been read. That is on purpose: a corpus entry is a test
# every future run pays for, and an automated commit would add them faster than
# anybody diagnoses them.

name: Fuzz

on:
  schedule:
    # 03:17 UTC, Monday to Saturday. The time is arbitrary; what matters is
    # that it is not the top of the hour, where every scheduled workflow on
    # GitHub queues.
    #
    # Sunday is excluded rather than left to run: the weekly leg below starts
    # an hour earlier and searches the same targets for four hours, so a daily
    # run on top of it duplicates all three jobs for twenty minutes and finds
    # what the longer one is already finding.
    - cron: "17 3 * * 1-6"
    # Sundays, 02:17 UTC. A different minute as well as a different day, so a
    # glance at a run's cron says which budget it got.
    - cron: "17 2 * * 0"
  # So it can be run against a branch before merging something that touches
  # the generator, which is when it is most likely to have something to say.
  workflow_dispatch:
    inputs:
      fuzztime:
        description: How long to search, as a Go duration
        default: 20m
        required: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto
  # One place decides the budget, so the two jobs cannot drift apart: whatever
  # a manual run asked for, else four hours on the Sunday cron, else twenty
  # minutes. GitHub's `a && b || c` is its ternary, and `inputs.fuzztime` is
  # empty on a schedule event, which is what makes the fallthrough work.
  FUZZTIME: ${{ inputs.fuzztime || (github.event.schedule == '17 2 * * 0' && '4h') || '20m' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # A failing target stops at the first input it finds, so the two run as
    # separate matrix legs: one target finding something must not hide whether
    # the other would have.
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzHostAgreesWithEmulator
          - FuzzOutsideTheSubsetIsRefused
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # FuzzHostAgreesWithEmulator compiles the emitter's generated CUDA C with
      # a host C++ compiler and runs it, so the runner needs one. ubuntu-latest
      # has g++ already; this says so out loud rather than relying on it, and
      # fails here with a clear message if that ever stops being true.
      - name: Show the host C++ compiler
        run: g++ --version

      - name: Search
        run: |
          # -timeout 0 because go test's own default is ten minutes and the
          # search is twenty, or four hours on a Sunday: without it the binary
          # panics partway through and the job reports a timeout rather than
          # whatever the fuzzer had found. The search is bounded by -fuzztime,
          # and the job by the runner.
          go test -timeout 0 -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime "$FUZZTIME" ./simt/

      # A failure writes the input that caused it into the package's testdata,
      # where it is the whole of what somebody needs to reproduce the case.
      # Keeping it is the point of the run.
      - name: Keep what it found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: simt/testdata/fuzz/
          if-no-files-found: ignore

  # The other oracle. It takes the whole of what the generator produces rather
  # than the third the host oracle is in scope for -- barriers, warp
  # primitives, atomics and shared tiles all compile here -- because it never
  # executes anything, and those constructs are where four of the defect
  # catalogue's eight ranks live. The defects NVRTC found and nothing else
  # would have are the three compile failures named in the target's own
  # comment; that is a different count and worth not merging into one.
  nvrtc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The wheel is libnvrtc and nothing else: no driver, no nvcc, no device.
      # The version is pinned because it is not only a library here -- the
      # target's generatorNoise list whitelists four NVRTC diagnostic numbers
      # as generator noise, and which numbers those are is a property of a
      # particular NVRTC. 12.8 is what docs/toolchain.md's measurements and
      # kernels/prebuilt's compute_75 artifacts were made against.
      - name: Install NVRTC
        run: |
          pip install --target "$RUNNER_TEMP/nvrtc" nvidia-cuda-nvrtc-cu12==12.8.93
          echo "SIMTGO_LIBNVRTC=$RUNNER_TEMP/nvrtc/nvidia/cuda_nvrtc/lib/libnvrtc.so.12" >>"$GITHUB_ENV"

      # Says out loud that the library landed where the previous step promised,
      # the way the other jobs assert g++ and nvidia-smi. SIMTGO_REQUIRE_NVRTC
      # below would catch it anyway, but it would catch it after a checkout, a
      # toolchain download and a compile, and name a Go test rather than a pip.
      - name: Show the NVRTC library
        run: ls -l "$SIMTGO_LIBNVRTC"

      # SIMTGO_REQUIRE_NVRTC turns the target's "no CUDA toolkit available"
      # skip into a failure. Without it this job is the worst outcome
      # available: with SIMTGO_LIBNVRTC pointing anywhere wrong, the leg passes
      # in three milliseconds having compiled nothing, and reports success.
      # SIMTGO_WARNING_TRIAGE gives the target a second look at the warnings
      # its allowlist suppressed, because that allowlist keys on the NVRTC
      # diagnostic number and the number is the same for a dropped use and for
      # the generator's own filler -- docs/verification.md's layer 10. It can
      # only put a warning back, never take one away, so without the secret it
      # degrades to exactly the behaviour above it, which is why nothing here
      # requires the secret to be set. It is not in ci.yml and should not be:
      # that workflow runs on a machine with no toolkit and no reason to reach
      # a service.
      - name: Search
        env:
          SIMTGO_REQUIRE_NVRTC: "1"
          SIMTGO_WARNING_TRIAGE: "1"
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          go test -tags cuda -timeout 0 -run '^$' \
            -fuzz '^FuzzNVRTCAcceptsTheGeneratedC$' -fuzztime "$FUZZTIME" ./simt/

      - name: Keep what it found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-FuzzNVRTCAcceptsTheGeneratedC
          path: simt/testdata/fuzz/
          if-no-files-found: ignore
